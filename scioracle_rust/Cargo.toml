[package]
name = "scioracle_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "scioracle_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.19.2", features = ["extension-module", "serde"] }
egg = "0.9.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
hex = "0.4.3"
